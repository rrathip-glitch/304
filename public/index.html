<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#0d4a2b">
  <title>304 — card game</title>
  <link rel="stylesheet" href="styles.css?v=2.2.20">
</head>
<body>
  <div id="app" class="screen-landing">
    <!-- Toast container for errors/info -->
    <div id="toast" class="toast hidden"></div>

    <!-- ========== LANDING ========== -->
    <section id="landing" class="screen">
      <div class="landing-card">
        <h1 class="title">304</h1>
        <p class="subtitle">Sri Lankan trick-taking, for four.</p>

        <label class="field">
          <span>Your name</span>
          <input id="name-input" type="text" maxlength="20" autocomplete="off" placeholder="Nimal" />
        </label>

        <button id="create-btn" class="btn primary">Create room</button>

        <div class="sep"><span>or</span></div>

        <label class="field">
          <span>Room code</span>
          <input id="code-input" type="text" maxlength="6" autocomplete="off" placeholder="ABC123" />
        </label>
        <button id="join-btn" class="btn">Join room</button>
        <div class="build-marker" id="build-marker">v2.2.20 — tap for diagnostics</div>
      </div>
    </section>

    <!-- ========== LOBBY ========== -->
    <section id="lobby" class="screen">
      <header class="lobby-head">
        <div class="room-label">Room</div>
        <div id="lobby-code" class="room-code">------</div>
        <div class="hint">Share this code with your partner.</div>
      </header>

      <div class="seats" id="lobby-seats">
        <!-- seats 0..3 injected: North/East/South/West -->
      </div>

      <div class="lobby-actions">
        <button id="start-btn" class="btn primary hidden">Start game</button>
        <button id="leave-btn" class="btn ghost">Leave</button>
      </div>
    </section>

    <!-- ========== TABLE ========== -->
    <section id="table" class="screen">
      <header class="table-head">
        <div class="tokens">
          <span class="team team-0" id="tok-0" title="Your team">
            <span class="label">Us</span>
            <span class="pips" id="pips-0"></span>
          </span>
          <span class="team team-1" id="tok-1" title="Opponents">
            <span class="label">Them</span>
            <span class="pips" id="pips-1"></span>
          </span>
        </div>
        <!-- Trump center — persistent graphic. "?" before open,
             suit glyph when revealed. No OPEN/CLOSED text needed;
             the presence of a suit IS the reveal. -->
        <div class="trump-dial" id="trump-dial">
          <span class="trump-dial-inner" id="trump-dial-inner">?</span>
        </div>
        <!-- v2.2.20: current-bid readout replaces the old hand-# / room-code
             cluster. Styling follows the header rhythm: gold primary value,
             muted small-caps secondary meta. Empty when no bid yet. -->
        <div class="head-right" id="head-right">
          <div class="bid-readout" id="bid-readout"></div>
        </div>
      </header>

      <div class="phase-banner" id="phase-banner"></div>

      <div class="play-area">
        <!-- Partner (top) -->
        <div class="seat-slot seat-top" id="seat-top">
          <div class="seat-name"></div>
          <div class="seat-cards"></div>
          <div class="seat-bid"></div>
        </div>

        <!-- L-opp (left) -->
        <div class="seat-slot seat-left" id="seat-left">
          <div class="seat-name"></div>
          <div class="seat-cards vertical"></div>
          <div class="seat-bid"></div>
        </div>

        <!-- R-opp (right) -->
        <div class="seat-slot seat-right" id="seat-right">
          <div class="seat-name"></div>
          <div class="seat-cards vertical"></div>
          <div class="seat-bid"></div>
        </div>

        <!-- Trick center -->
        <div class="trick" id="trick">
          <div class="trick-card slot-top"></div>
          <div class="trick-card slot-right"></div>
          <div class="trick-card slot-bottom"></div>
          <div class="trick-card slot-left"></div>
        </div>
      </div>

      <!-- Your hand (bottom). v2.2.9: the trump indicator (for the maker)
           is rendered INLINE inside #your-hand as a labeled card with a
           visual gap, so the separate #your-trump row was removed. -->
      <div class="seat-slot seat-bottom" id="seat-bottom">
        <div class="seat-name you"></div>
        <div class="your-hand" id="your-hand"></div>
      </div>

      <!-- Action bar -->
      <div class="action-bar" id="action-bar">
        <div class="action-chips" id="action-chips"></div>
        <div class="action-extras" id="action-extras"></div>
      </div>

      <!-- Log -->
      <details class="log-wrap" id="log-wrap">
        <summary>Log</summary>
        <ul class="log" id="log"></ul>
      </details>
    </section>
  </div>

  <!-- Transient event flash: trump reveal + trick-won banners.
       Pointer-events off; auto-dismisses after its timer. -->
  <div id="flash-overlay" class="flash-overlay hidden" aria-hidden="true"></div>

  <!-- Debug overlay: tap the build marker to toggle. Off by default. -->
  <div id="debug-overlay" class="debug-overlay hidden">
    <div class="debug-row">build: <b id="dbg-build">2.2.20</b></div>
    <div class="debug-row">socket: <b id="dbg-sock">-</b></div>
    <div class="debug-row">gate: <b id="dbg-gate">-</b></div>
    <div class="debug-row">queued: <b id="dbg-pending">0</b></div>
    <div class="debug-row">session: <b id="dbg-session">-</b></div>
    <div class="debug-row">events:</div>
    <ul id="dbg-events" class="debug-events"></ul>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="cards.js?v=2.2.20"></script>
  <script src="client.js?v=2.2.20"></script>
</body>
</html>
